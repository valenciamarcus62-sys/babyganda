<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Crichel 💙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1e3d, #1a3b70, #2e6bc4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #6ab7ff;
            transform: rotate(-45deg);
            animation: floatUp 6s ease-in-out infinite;
            opacity: 0.6;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #6ab7ff;
            border-radius: 50%;
        }

        .heart::before {
            top: -15px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 15px;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(-45deg); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-50px) rotate(-45deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.12);
            padding: 35px 45px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 80, 180, 0.35);
            animation: fadeIn 2s ease forwards;
            transform: translateY(30px);
            opacity: 0;
            max-width: 600px;
            width: 90%;
        }

        @keyframes fadeIn {
            to { transform: translateY(0); opacity: 1; }
        }

        .photo-frame {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid #6ab7ff;
            padding: 6px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(106, 183, 255, 0.5);
            overflow: hidden;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .photo-frame img.active {
            opacity: 1;
        }

        h1 {
            color: #e0f0ff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(100, 180, 255, 0.6);
        }

        .subtext {
            color: #b8d8ff;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .name {
            color: #90c8ff;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 36px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        #yesBtn {
            background: linear-gradient(135deg, #2e8bff, #54a0ff);
            color: white;
            box-shadow: 0 4px 15px rgba(50, 130, 255, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(50, 130, 255, 0.6);
        }

        #noBtn {
            background: #e6f0ff;
            color: #2554a0;
            position: relative;
        }

        .response {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #e0f0ff;
            display: none;
            animation: popIn 0.5s ease forwards;
            line-height: 1.6;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 480px) {
            .container { padding: 25px 30px; }
            h1 { font-size: 1.6rem; }
            .subtext { font-size: 1rem; }
            .photo-frame { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
    <div id="hearts"></div>
    <div id="sparkles"></div>

    <div class="container">
        <div class="photo-frame">
            <img src="https://i.imgur.com/LdQrXzY.jpg" class="active" alt="Crichel 1">
            <img src="https://i.imgur.com/9sZbKvA.jpg" alt="Crichel 2">
            <img src="https://i.imgur.com/8kfM7tW.jpg" alt="Crichel 3">
        </div>

        <h1>Hi <span class="name">Crichel</span> 💙</h1>

        <p class="subtext">
            Will you stay with me for the rest of my life?<br>
            If yes, will you marry me? 💙
        </p>

        <div class="buttons">
            <button id="yesBtn">Yes, I will 💙</button>
            <button id="noBtn">No 😔</button>
        </div>

        <div class="response" id="response"></div>
    </div>

    <script>
        const heartsContainer = document.getElementById('hearts');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const size = Math.random() * 20 + 15;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }
        setInterval(createHeart, 600);

        const sparklesContainer = document.getElementById('sparkles');
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.animationDelay = Math.random() * 3 + 's';
            sparklesContainer.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 3000);
        }
        setInterval(createSparkle, 400);

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const response = document.getElementById('response');
        let noCount = 0;

        yesBtn.addEventListener('click', () => {
            response.style.display = 'block';
            response.innerHTML = `Yay!! 🥰💙 You just made me the happiest person alive, Crichel.<br>I promise to love you, take care of you, and stay with you for the rest of our lives. ✨💙`;
            for(let i = 0; i < 40; i++) setTimeout(createHeart, i * 80);
        });

        const noMessages = [
            "Are you sure? 🥺💙",
            "Please reconsider... 😢💙",
            "Don't do this to me! 💔💙",
            "I'll be sad forever... 😭💙",
            "Pretty please? 🙏💙",
            "Think again? 🥺✨💙",
            "I'll give you all the blue hearts! 💙💙"
        ];

        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.transition = 'all 0.2s ease';
            noBtn.innerText = noMessages[noCount % noMessages.length];
            noCount++;
            noBtn.style.transform = `scale(${Math.max(1 - noCount * 0.08, 0.3)})`;
            yesBtn.style.transform = `scale(${1 + noCount * 0.05})`;
        });

        const photos = document.querySelectorAll('.photo-frame img');
        let currentPhoto = 0;
        setInterval(() => {
            photos[currentPhoto].classList.remove('active');
            currentPhoto = (currentPhoto + 1) % photos.length;
            photos[currentPhoto].classList.add('active');
        }, 3000);
    </script>
</body>
</html>
